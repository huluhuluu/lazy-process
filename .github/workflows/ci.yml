name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the gates be run by hand from the Actions tab without an empty commit.
  workflow_dispatch:

# A full Slint + windows-crate build takes minutes; drop superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gates only read the repository. Without this the job inherits
# whatever the repository default is, which for older repositories is read-write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    # Windows-only crate: the windows crate and the tray integration do not
    # build elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The version comes from rust-toolchain.toml, so CI and a local checkout agree.
      # `@stable` would follow the newest release, which is how the 1.99.0 clippy lint
      # that broke this workflow arrived unannounced.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The four gates from README.md, in the same order.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

  # Separate job on purpose. The advisory check fetches the RustSec database over the
  # network, and a fetch hiccup there should not be able to mask the deterministic
  # format/clippy/test/build gates, which is what happened when this ran as a trailing
  # step of the job above.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # `Cargo.lock` is the whole input: `cargo audit` reads it and nothing else, so this
      # needs neither the Windows toolchain nor the multi-minute Slint build.
      - uses: taiki-e/install-action@cargo-audit

      - run: cargo audit
